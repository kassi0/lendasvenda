services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: dominio-flask
    restart: unless-stopped
    ports:
      # Expõe a aplicação Flask na porta 5002 do host para o Nginx do servidor
      - "${PORT:-5002}:5002"
    environment:
      - PORT=5002
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - INITIAL_BID=${INITIAL_BID:-300}
      - DB_PATH=/data/lances.db
    volumes:
      - lances_data:/data

volumes:
  lances_data:
    name: dominio_lances_data
